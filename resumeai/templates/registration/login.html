{% extends "base.html" %}
{% block title %}Log in — ResumeAI{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card p-4">
  <h3 class="mb-3">Log in</h3>
  <form method="post" class="auth-form">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3 mb-0 small text-muted">No account? <a href="{% url 'register' %}">Sign up</a></p>
</div></div></div>
{% endblock %}
