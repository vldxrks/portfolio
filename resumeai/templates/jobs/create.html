{% extends "base.html" %}
{% block title %}Add vacancy — ResumeAI{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card p-4">
  <h3 class="mb-1">Add vacancy</h3>
  <p class="text-muted">Paste the job description. Skills are recognized from the text you provide.</p>
  <form method="post" class="auth-form">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save vacancy</button></form>
</div></div></div>
{% endblock %}
