services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resumeai}
      POSTGRES_USER: ${POSTGRES_USER:-resumeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resumeai}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      PRIVATE_MEDIA_ROOT: /data/private_media
    ports: ["8000:8000"]
    volumes: [media:/data/private_media]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  media:
