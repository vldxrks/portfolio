{% extends "base.html" %}
{% block scene %}grid{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width:640px"><h1 class="h4">{{ title }}</h1>
<form method="post" novalidate>{% csrf_token %}{{ form.non_field_errors }}
{% for f in form %}<div class="mb-3"><label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
 {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary">Save</button> <a class="btn btn-link" href="{% url 'habit-list' %}">Cancel</a></form></div>
{% endblock %}
